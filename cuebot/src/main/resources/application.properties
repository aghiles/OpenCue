server.port=8080
spring.main.allow-bean-definition-overriding=true

# Redis Configuration (when redis profile is active)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

# Redis connection settings
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.database=${REDIS_DATABASE:0}
redis.timeout=${REDIS_TIMEOUT:2000}
redis.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
redis.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
redis.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
redis.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1}

# Dispatcher settings for Redis
dispatcher.redis.frame.batch.size=${DISPATCHER_REDIS_FRAME_BATCH_SIZE:100}
dispatcher.redis.booking.ttl.hours=${DISPATCHER_REDIS_BOOKING_TTL_HOURS:24}
dispatcher.redis.host.timeout.minutes=${DISPATCHER_REDIS_HOST_TIMEOUT_MINUTES:5}

# Enable Redis Lua script caching
redis.script.cache.enabled=${REDIS_SCRIPT_CACHE_ENABLED:true}

# Performance tuning
redis.pipeline.enabled=${REDIS_PIPELINE_ENABLED:true}
redis.pipeline.sync.size=${REDIS_PIPELINE_SYNC_SIZE:100}
