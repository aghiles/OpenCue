# Redis-specific Spring profile configuration
# This file is loaded when running with: -Dspring.profiles.active=redis

# Override default database configuration to use Redis DAOs
spring.main.allow-bean-definition-overriding=true

# Redis connection configuration
spring.redis.host=${redis.host}
spring.redis.port=${redis.port}
spring.redis.password=${redis.password}
spring.redis.database=${redis.database}
spring.redis.timeout=${redis.timeout}
spring.redis.lettuce.pool.max-active=${redis.pool.max-active}
spring.redis.lettuce.pool.max-idle=${redis.pool.max-idle}
spring.redis.lettuce.pool.min-idle=${redis.pool.min-idle}
spring.redis.lettuce.pool.max-wait=${redis.pool.max-wait}

# Redis Cluster configuration (if enabled)
spring.redis.cluster.nodes=${redis.cluster.nodes}
spring.redis.cluster.max-redirects=${redis.cluster.max-redirects}

# Redis Sentinel configuration (if enabled)
spring.redis.sentinel.master=${redis.sentinel.master}
spring.redis.sentinel.nodes=${redis.sentinel.nodes}

# Enable Redis repositories
spring.data.redis.repositories.enabled=true

# Redis-specific dispatcher settings
dispatcher.engine.type=REDIS
dispatcher.redis.enabled=true
dispatcher.booking.mode=REDIS

# Disable SQL-based scheduling when using Redis
dispatcher.sql.enabled=false

# Redis health check
management.health.redis.enabled=true

# Cache configuration using Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=${redis.ttl.cache.minutes:60}m
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=opencue:cache:

# Session management with Redis (if needed)
spring.session.store-type=redis
spring.session.redis.namespace=opencue:session
spring.session.timeout=${session.timeout:30m}

# Logging configuration for Redis profile
logging.level.com.imageworks.spcue.dao.redis=INFO
logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=INFO

# Performance settings specific to Redis
dispatcher.frame.query.max=1000
dispatcher.host.query.max=500
dispatcher.booking.retry.max=3
dispatcher.booking.retry.delay.ms=100

# Redis-specific feature flags
feature.redis.pipeline.enabled=true
feature.redis.lua.scripts.enabled=true
feature.redis.async.enabled=false

# Monitoring and metrics
redis.metrics.enabled=true
redis.slow.log.threshold.ms=10
